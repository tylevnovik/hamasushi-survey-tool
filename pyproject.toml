[project]
name = "hamasushi-survey-tool"
version = "0.2.0"
description = "Automated survey filler and validation code extractor for Hamasushi China (csfeedback.net)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
desktop = [
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
]
browser = [
    "playwright>=1.48.0",
]

[tool.uv]
package = false
